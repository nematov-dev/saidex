{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <title>Saidex — {% trans "Super Admin" %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="{% static 'landing/favicon.svg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #1f2937 0%, #0b0f19 70%);
        }
        .card { border: 0; border-radius: 1rem; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
        .badge-super {
            display: inline-flex; align-items: center; gap: .4rem;
            background: rgba(217, 164, 65, .12); color: #d9a441;
            border: 1px solid rgba(217, 164, 65, .35);
            border-radius: 2rem; padding: .25rem .8rem; font-size: .75rem; font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card p-4" style="width: 380px; background: #151b28;">
        <div class="text-center mb-3">
            <span class="badge-super"><i class="bi bi-shield-lock-fill"></i> {% trans "SUPER ADMIN" %}</span>
        </div>
        <h4 class="mb-1 text-center text-white">Saidex</h4>
        <p class="text-secondary text-center small mb-4">{% trans "Bu bo'lim faqat loyiha egasi uchun" %}</p>

        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
                <div class="alert alert-danger py-2 small">
                    {% trans "Login/parol noto'g'ri, yoki bu hisob super admin emas." %}
                </div>
            {% endif %}
            <div class="mb-3">
                <label class="form-label text-secondary small">{% trans "Login" %}</label>
                <input class="form-control" type="text" name="username" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label text-secondary small">{% trans "Parol" %}</label>
                <input class="form-control" type="password" name="password" required>
            </div>
            <button class="btn w-100" style="background:#d9a441; color:#151b28; font-weight:600;" type="submit">
                {% trans "Kirish" %}
            </button>
        </form>
    </div>
</body>
</html>
