{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <title>{% trans "Kirish" %} — {{ BUSINESS_NAME }}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'landing/favicon.svg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="height:100vh; background:#111827;">
    <div class="card p-4 shadow" style="width: 360px;">
        <h4 class="mb-3 text-center">{{ BUSINESS_NAME }}</h4>
        <p class="text-muted text-center small">{% trans "Panelga kirish" %}</p>
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
                <div class="alert alert-danger py-2">{% trans "Login yoki parol noto'g'ri." %}</div>
            {% endif %}
            <div class="mb-3">
                <label class="form-label">{% trans "Email yoki login" %}</label>
                <input class="form-control" type="text" name="username" value="{{ form.username.value|default:'' }}" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">{% trans "Parol" %}</label>
                <input class="form-control" type="password" name="password" required>
            </div>
            <button class="btn btn-dark w-100" type="submit">{% trans "Kirish" %}</button>
        </form>
        <p class="text-center small mt-3 mb-0">
            {% trans "Hisobingiz yo'qmi?" %}
            <a href="{% url 'landing:register' %}">{% trans "Ro'yxatdan o'tish" %}</a>
        </p>
    </div>
</body>
</html>
